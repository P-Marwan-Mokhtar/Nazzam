<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الصفحة غير موجودة — نَظَّم</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/app/icons/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        font-family: "IBM Plex Sans Arabic", "Cairo", Tahoma, sans-serif;
        background: #ffffff;
        color: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { text-align: center; max-width: 560px; }
      .logo { width: 88px; height: 88px; margin: 0 auto 28px; display: block; }
      .code {
        font-family: "Cairo", sans-serif;
        font-weight: 800;
        font-size: clamp(5rem, 18vw, 8.5rem);
        line-height: 1;
        background: linear-gradient(135deg, #097fe8, #086fce);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: #097fe8;
        letter-spacing: 0.05em;
      }
      h1 {
        font-family: "Cairo", sans-serif;
        font-weight: 800;
        font-size: clamp(1.5rem, 4vw, 2rem);
        margin: 8px 0 10px;
        color: #000000;
      }
      p {
        color: #414d5c;
        font-size: 1rem;
        line-height: 1.8;
        margin-bottom: 32px;
      }
      .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: "Cairo", sans-serif;
        font-weight: 700;
        font-size: 0.95rem;
        padding: 12px 24px;
        border-radius: 12px;
        text-decoration: none;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      }
      .btn-primary {
        background: #097fe8;
        color: #ffffff;
        box-shadow: 0 12px 28px -10px rgba(9, 127, 232, 0.42);
      }
      .btn-primary:hover { background: #086fce; transform: translateY(-2px); }
      .btn-ghost {
        background: #ffffff;
        color: #000000;
        border: 1.5px solid #e2e8f0;
      }
      .btn-ghost:hover { border-color: #097fe8; color: #097fe8; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="/app/img/nazzam-logo.png" alt="نظم" class="logo" width="88" height="88" />
      <div class="code">404</div>
      <h1>الصفحة غير موجودة</h1>
      <p>
        يبدو أن الرابط الذي وصلت إليه غير صحيح أو أن الصفحة نُقلت.
        يمكنك العودة إلى الصفحة الرئيسية أو الدخول إلى التطبيق.
      </p>
      <div class="actions">
        <a href="/" class="btn btn-primary">العودة إلى الرئيسية</a>
        <a href="/app/" class="btn btn-ghost">الدخول إلى التطبيق</a>
      </div>
    </div>
  </body>
</html>
