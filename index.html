<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المهام اليومية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rakkas&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap" id="app">
  <div class="binding"><span></span><span></span><span></span><span></span><span></span></div>
  <div class="header-card">
    <button class="stats-trigger-btn" id="statsBtn" title="الإحصائيات">
      <span class="material-icons">insights</span>
    </button>
    <button class="calendar-trigger-btn" id="calendarBtn" title="التقويم">
      <span class="material-icons">calendar_today</span>
    </button>
    <button class="drafts-trigger-btn" id="draftsBtn" title="المهام المؤرشفة (Drafts)">
      <span class="material-icons">drafts</span>
    </button>
    <button class="account-trigger-btn" id="accountBtn" title="الحساب">
      <span class="material-icons" id="accountIcon">person_outline</span>
    </button>
    <button class="theme-trigger-btn" id="themeBtn" title="الوضع الليلي">
      <span class="material-icons" id="themeIcon">dark_mode</span>
    </button>
    <h1>المهام اليومية</h1>
    <p class="subtitle">بنك مهامك الجاهز.. اسحب منه اللي هتعمله النهاردة</p>
  </div>

  <div class="main-layout">
    <div class="main-col">
      <div id="content"></div>
    </div>
    <div class="timer-col">
      <div id="timerPanel"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="statsOverlay">
  <div class="modal-card">
    <div class="modal-header">
      <h2>إحصائيات الأسبوع</h2>
      <button class="icon-btn" id="closeStatsBtn" title="إغلاق"><span class="material-icons">close</span></button>
    </div>
    <div class="modal-body" id="statsBody"></div>
  </div>
</div>

<div class="modal-overlay" id="calendarOverlay">
  <div class="modal-card" style="max-width: 380px;">
    <div class="modal-header">
      <h2>التقويم</h2>
      <button class="icon-btn" id="closeCalendarBtn" title="إغلاق"><span class="material-icons">close</span></button>
    </div>
    <div class="modal-body">
      <div class="calendar-card">
        <div class="calendar-header">
          <button class="nav-btn" id="calPrevMonth" style="width:34px;height:34px;"><span class="material-icons">chevron_right</span></button>
          <span class="calendar-month-title" id="calMonthTitle"></span>
          <button class="nav-btn" id="calNextMonth" style="width:34px;height:34px;"><span class="material-icons">chevron_left</span></button>
        </div>
        <div class="calendar-grid" id="calGrid"></div>
      </div>
    </div>
  </div>
</div>

<!-- Modal للـ Drafts مع البحث الذكي -->
<div class="modal-overlay" id="draftsOverlay">
  <div class="modal-card" style="max-width: 500px;">
    <div class="modal-header">
      <h2>بنك المسودات (Drafts)</h2>
      <button class="icon-btn" id="closeDraftsBtn" title="إغلاق"><span class="material-icons">close</span></button>
    </div>
    <div class="modal-body">
      <div class="bank-search" style="margin-top: 0; margin-bottom: 14px;">
        <span class="material-icons bank-search-icon">search</span>
        <input type="text" id="draftsSearchInput" placeholder="بحث ذكي في المسودات..." />
        <button class="bank-search-clear" id="draftsSearchClear" style="display:none;" title="مسح البحث"><span class="material-icons">close</span></button>
      </div>
      <div id="draftsModalList" style="display: flex; flex-direction: column; gap: 8px; max-height: 350px; overflow-y: auto;">
        <!-- سيتم تعبئتها ديناميكياً -->
      </div>
    </div>
  </div>
</div>

<!-- Modal الحساب: ربط الحساب المجهول بإيميل/باسورد أو تسجيل الدخول -->
<div class="modal-overlay" id="accountOverlay">
  <div class="modal-card" style="max-width: 420px;">
    <div class="modal-header">
      <h2>الحساب</h2>
      <button class="icon-btn" id="closeAccountBtn" title="إغلاق"><span class="material-icons">close</span></button>
    </div>
    <div class="modal-body" id="accountBody"></div>
  </div>
</div>

<div class="modal-overlay picker-overlay" id="durationPickerOverlay">
  <div class="picker-sheet">
    <div class="picker-header">
      <button class="picker-cancel" id="pickerCancelBtn">إلغاء</button>
      <h3>مدة المهمة</h3>
      <button class="picker-done" id="pickerDoneBtn">تم</button>
    </div>
    <div class="picker-body">
      <div class="wheel-picker">
        <div class="wheel-highlight"></div>
        <div class="wheel-col" id="hoursWheel"><ul class="wheel-list" id="hoursWheelList"></ul></div>
        <div class="wheel-label-col">س</div>
        <div class="wheel-col" id="minutesWheel"><ul class="wheel-list" id="minutesWheelList"></ul></div>
        <div class="wheel-label-col">د</div>
      </div>
    </div>
  </div>
</div>

<!-- Modal مكان إضافة المهمة -->
<div class="modal-overlay" id="addChoiceOverlay">
  <div class="modal-card" style="max-width: 440px;">
    <div class="modal-header">
      <h2>مكان إضافة المهمة</h2>
      <button class="icon-btn" id="closeAddChoiceBtn" title="إغلاق"><span class="material-icons">close</span></button>
    </div>
    <div class="modal-body">
      <p style="color: var(--ink-soft); font-size: 0.95rem; margin-top: 0; margin-bottom: 16px; line-height: 1.5;">
        عايز تضيف مهمة <strong id="pendingTaskNameDisplay" style="color: var(--pen);"></strong> لفين بالظبط؟
      </p>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <button class="choice-btn choice-today" id="choiceTodayBtn">
          <span class="material-icons">today</span>
          <div class="choice-text">
            <strong>مهام اليوم فقط</strong>
            <span>تتضاف لجدول النهاردة بس ومش هتتحفظ في البنك</span>
          </div>
        </button>
        <button class="choice-btn" id="choiceBankBtn">
          <span class="material-icons">inventory_2</span>
          <div class="choice-text">
            <strong>بنك المهام</strong>
            <span>تتحفظ في البنك عشان تقدر تسحبها في أي يوم بعد كدا</span>
          </div>
        </button>
        <button class="choice-btn choice-both" id="choiceBothBtn">
          <span class="material-icons">done_all</span>
          <div class="choice-text">
            <strong>في الاتنين مع بعض</strong>
            <span>تتحفظ في البنك وتتضاف لجدول النهاردة في نفس الوقت</span>
          </div>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
